# Weekly dependency patches across all configured ecosystems.
# Source dependencies remain manually pinned; only GitHub Actions receive scheduled updates.
version: 2
updates:
- package-ecosystem: github-actions
  labels:
  - dependencies
  - github-actions
  directory: /
  multi-ecosystem-group: weekly-patches
  patterns:
  - '*'
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
multi-ecosystem-groups:
  weekly-patches:
    schedule:
      interval: weekly
      day: monday
      time: 09:00
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(actions)
      include: scope
